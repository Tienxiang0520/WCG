name: Verify WCG Azure build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wcg-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install Pillow==12.1.1
      - name: Test game rules
        run: dotnet test WcgTests/WcgTests.csproj --nologo -c Release
      - name: Build Azure website and test browser adapters
        run: node SoulOath.Static/tools/build-site.mjs .build-tmp/azure-site --azure
      - name: Validate public package
        run: node SoulOath.Static/tools/check-azure-output.mjs .build-tmp/azure-site/dist
