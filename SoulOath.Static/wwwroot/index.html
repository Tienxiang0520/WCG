<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>魂誓</title><meta name="description" content="魂誓：五大意志交鋒的單人卡牌對戰。組牌、人機對戰與本機天梯。" />
    <base href="/" /><link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" /><link rel="stylesheet" href="wcg.css" />
    <link rel="stylesheet" href="SoulOath.Static.styles.css" /><link rel="stylesheet" href="battle/battle.css" />
    <link rel="stylesheet" href="deck-print.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
    <style>
        body{background:#14161d;color:#e6eef8}
        .startup{padding:3rem;max-width:40rem;margin:10vh auto}
        .startup h1{font-size:2rem}.startup p{color:#a6bcd2}
        .startup-download{display:flex;align-items:center;gap:1rem;max-width:26rem;margin-top:1.4rem}
        .startup-download progress{appearance:none;-webkit-appearance:none;flex:1;min-width:0;height:.85rem;border:0;border-radius:1rem;overflow:hidden;background:#2b3545}
        .startup-download progress::-webkit-progress-bar{background:#2b3545;border-radius:1rem}
        .startup-download progress::-webkit-progress-value{background:#67b7ef;border-radius:1rem;transition:width .15s ease-out}
        .startup-download progress::-moz-progress-bar{background:#67b7ef;border-radius:1rem}
        #startup-percentage{min-width:3.5rem;text-align:right;font-variant-numeric:tabular-nums;color:#b8dafa}
        .startup.failed p{color:#efb0bb}.startup.failed progress::-webkit-progress-value{background:#db8293}
        .startup.failed progress::-moz-progress-bar{background:#db8293}
        @media(prefers-reduced-motion:reduce){.startup-download progress::-webkit-progress-value{transition:none}}
        @media(max-width:480px){.startup{padding:1.5rem}}
        #blazor-error-ui{display:none;position:fixed;bottom:0;background:#44212e;color:#fff;padding:1rem;width:100%;z-index:2000}
    </style>
</head>
<body>
    <div id="app"><main class="startup"><h1>🔮 魂誓</h1><p id="startup-status" role="status">正在下載遊戲資料…</p><div class="startup-download"><progress id="startup-progress" value="0" max="100" aria-label="遊戲下載進度"></progress><span id="startup-percentage" aria-hidden="true">0%</span></div></main></div>
    <div id="blazor-error-ui" role="alert">載入發生錯誤。<a href="." class="reload">重新整理</a></div>
    <noscript>請開啟瀏覽器 JavaScript，才能進行魂誓對戰。</noscript>
    <script src="startup.js"></script>
    <script src="local-data.js"></script>
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        Promise.resolve().then(() => soulOathStorage.ready).then(() => Blazor.start()).catch(() => {
            window.wcgStartup?.fail();
            document.querySelector('#blazor-error-ui').style.display = 'block';
        });
    </script>
</body>
</html>
